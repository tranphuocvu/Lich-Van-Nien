<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F7F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lịch Vạn Niên">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Lịch Vạn Niên</title>
<style>
:root{--bg:#F2F7F4;--ink:#12231D;--mut:#54665E;--pri:#1F6B5A;--on:#fff;--acc:#8F5F0C;--soft:#E0EEE8;--card:#fff;--line:#D5E4DC;--good:#2563A6;--bad:#C2410C;--sun:#B42318;--gbg:#E1EBF7;--gfg:#1B4B80;--bbg:#FBE6DA;--bfg:#8A2F08;--fade:#A9B8B0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button,input{font:inherit;color:inherit}button{border:0;background:none;padding:0;cursor:pointer;text-align:left}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.page{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:calc(env(safe-area-inset-top) + 16px) 12px 10px}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:10px;padding:0 4px 20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 4px}
h1{margin:0;font:700 26px ui-serif,Georgia,"Times New Roman",serif;color:var(--pri)}
.sub{font-size:12px;color:var(--mut);margin-top:2px}
.ib{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;flex:none}
.arrows{display:flex;gap:8px}
.wk,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wk{text-align:center;font-size:12px;font-weight:600;color:var(--mut)}.wk .sun{color:var(--sun)}
.grid{flex:1;min-height:0;gap:3px}
.c{border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid #E3EDE7;background:transparent;text-align:center;min-height:0}
.c b{font-size:22px;font-weight:600;line-height:1}.c i{font-style:normal;font-size:13px;color:var(--mut)}.c i.f{color:var(--acc);font-weight:700}
.c u{width:7px;height:7px;border-radius:4px}.c u.h{background:var(--good)}
.c.sun{color:var(--sun)}.c.out{color:var(--fade);border-color:transparent}.c.out i{color:var(--fade)}
.c.td{background:var(--pri);color:var(--on);border-color:var(--pri)}.c.td i,.c.td i.f{color:var(--on)}.c.td u.h{background:var(--on)}
.leg{display:flex;gap:16px;justify-content:center;font-size:11.5px;color:var(--mut)}.leg span{display:flex;align-items:center;gap:5px}.leg em{display:inline-block;width:8px;height:8px;border-radius:4px}
.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut);text-align:center}.nav button.on{color:var(--pri)}
.hd{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 10px) 12px 6px}.hd .t{flex:1;font:600 15px ui-serif,Georgia,serif;text-align:center}
.hero{background:var(--pri);color:var(--on);border-radius:20px;padding:16px 18px;display:flex;gap:18px;align-items:center}
.hero b{font:700 60px/1 ui-serif,Georgia,serif}.hero div{font-size:13px;line-height:1.6}.hero .t1{font-weight:600;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:14px;background:var(--soft);font-size:12px;font-weight:600}.chip.g{background:var(--gbg);color:var(--gfg)}.chip.b{background:var(--bbg);color:var(--bfg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card .h{display:flex;justify-content:space-between;align-items:center;gap:8px}.card .h b{font-size:14px}
.kv{display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.45}.kv div{display:flex;gap:10px}.kv span:first-child{width:92px;flex:none;color:var(--mut)}.kv span:last-child{flex:1}
.ok{display:flex;gap:8px;align-items:center;font-size:13px}.ok svg{flex:none}.ok.no{color:var(--bfg);font-weight:600}
.note{font-size:12px;color:var(--mut);line-height:1.5}.txt{font-size:13px;line-height:1.5}
.pill{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;text-align:center}.pill.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;width:100%}
.it .d{width:48px;height:48px;border-radius:12px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1.1;flex:none;text-align:center}.it .d span{font-size:10px;font-weight:600;color:var(--mut)}
.it .x{flex:1;min-width:0}.it .x b{font-size:14px}.it .x div{font-size:12px;color:var(--mut);margin-top:2px}
.bar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 16px}
input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--card);font-size:16px;-webkit-appearance:none;appearance:none;text-align:left}
label{font-size:12px;color:var(--mut);font-weight:600;display:block;margin-bottom:6px}
.btn{min-height:46px;border-radius:14px;border:1px solid var(--pri);background:var(--pri);color:var(--on);font-weight:600;font-size:14px;width:100%;text-align:center}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.empty{text-align:center;color:var(--mut);padding:24px 0;font-size:13.5px}
</style>
</head>
<body>
<div id="app"></div>
<script src="lunar.js"></script>
<script>
(function(){
var WDL=['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
var VIEC=[['cưới hỏi','Cưới hỏi'],['khai trương','Khai trương'],['động thổ','Động thổ'],['xây dựng','Xây dựng'],['xuất hành','Xuất hành'],['ký kết','Ký kết']];
var IC={l:'<path d="M15 5l-7 7 7 7"/>',r:'<path d="M9 5l7 7-7 7"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>',s:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',cv:'<path d="M7 7h12l-3-3M17 17H5l3 3"/>',ck:'<path d="M5 12l5 5 9-10"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>'};
function svg(n,s,c){return '<svg width="'+(s||20)+'" height="'+(s||20)+'" viewBox="0 0 24 24" fill="none" stroke="'+(c||'currentColor')+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>'}
function p2(n){return n<10?'0'+n:''+n}
var $=function(s){return document.querySelector(s)};
var C={};function info(y,m,d){var k=y*10000+m*100+d;return C[k]||(C[k]=Lunar.info(d,m,y))}
function dow(y,m,d){return new Date(y,m-1,d).getDay()}
function lbl(y,m,d){return WDL[dow(y,m,d)]+', '+d+'/'+m+'/'+y}
var now=new Date(),T={y:now.getFullYear(),m:now.getMonth()+1,d:now.getDate()};
var S={tab:'cal',view:'main',y:T.y,m:T.m,sel:null,fk:'cưới hỏi',fy:T.y,fm:T.m,cv:'s2l',res:''};
function isT(y,m,d){return y===T.y&&m===T.m&&d===T.d}
function head(y,m,t){var mid=info(y,m,15);return '<div class="top"><div><h1>'+t+'</h1><div class="sub">Tháng '+mid.lm+' âm · '+mid.canChiThang+' · '+mid.canChiNam+'</div></div><div class="arrows"><button class="ib" data-a="prev" aria-label="Tháng trước">'+svg('l',18)+'</button><button class="ib" data-a="next" aria-label="Tháng sau">'+svg('r',18)+'</button></div></div>'}
function cal(){var y=S.y,m=S.m,f=(new Date(y,m-1,1).getDay()+6)%7,dim=new Date(y,m,0).getDate(),rows=Math.ceil((f+dim)/7),g='';
for(var i=0;i<rows*7;i++){var dt=new Date(y,m-1,1-f+i),cy=dt.getFullYear(),cm=dt.getMonth()+1,cd=dt.getDate(),n=info(cy,cm,cd);
g+='<button class="c'+(cm!==m?' out':'')+(isT(cy,cm,cd)?' td':'')+(i%7===6?' sun':'')+'" data-a="open" data-y="'+cy+'" data-m="'+cm+'" data-d="'+cd+'" aria-label="'+lbl(cy,cm,cd)+', âm lịch '+n.ld+'/'+n.lm+'"><b>'+cd+'</b><i'+(n.ld===1?' class="f"':'')+'>'+(n.ld===1?n.ld+'/'+n.lm:n.ld)+'</i><u class="'+(n.hoangDao?'h':'')+'"></u></button>'}
return '<div class="page">'+head(y,m,'Tháng '+m+', '+y)+'<div class="wk"><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span class="sun">CN</span></div><div class="grid" style="grid-template-rows:repeat('+rows+',minmax(0,1fr))">'+g+'</div><div class="leg"><span><em style="background:var(--good)"></em>Ngày hoàng đạo</span><span><em style="background:var(--pri)"></em>Hôm nay</span></div></div>'}
function chip(t,c){return '<span class="chip'+(c?' '+c:'')+'">'+t+'</span>'}
function chips(a,c){return '<div class="chips">'+a.map(function(x){return chip(x,c)}).join('')+'</div>'}
function card(t,body,tag){return '<div class="card"><div class="h"><b>'+t+'</b>'+(tag||'')+'</div>'+body+'</div>'}
function kv(r){return '<div class="kv">'+r.map(function(x){return '<div><span>'+x[0]+'</span><span>'+x[1]+'</span></div>'}).join('')+'</div>'}
function gh(a){return a.map(function(x){return x.replace(' ',' ').replace(/(\d+)-(\d+)$/,'$1h-$2h')})}
function dayV(){var s=S.sel,n=info(s.y,s.m,s.d),ky=n.ky.length,td=isT(s.y,s.m,s.d),gio=td?'<br>Giờ hiện tại: '+Lunar.gioHienTai(n.jd,now.getHours()):'';
var dg=n.danhGia,dc=n.diem>=2?'g':n.diem<0?'b':'';
return '<div class="hd"><button class="ib" data-a="back" aria-label="Quay lại">'+svg('l',18)+'</button><div class="t">'+lbl(s.y,s.m,s.d)+'</div><button class="ib" data-a="pd" aria-label="Ngày trước">'+svg('l',16)+'</button><button class="ib" data-a="nd" aria-label="Ngày sau">'+svg('r',16)+'</button></div><div class="scroll">'+
'<div class="hero"><b>'+n.ld+'</b><div><div class="t1">Tháng '+n.lm+(n.leap?' nhuận':'')+' âm, năm '+n.canChiNam+'</div>Ngày '+n.canChiNgay+' · Tháng '+n.canChiThang+gio+'</div></div>'+
chips([(n.hoangDao?'Hoàng đạo: ':'Hắc đạo: ')+n.than,'Trực '+n.truc,'Tiết '+n.tiet+' · '+n.kinhDo+'°'],'')+
card('Giờ hoàng đạo',chips(gh(n.gio),'g'))+card('Giờ hắc đạo',chips(gh(n.gioHac),'b'))+
card('Các ngày kỵ','<div style="display:flex;flex-direction:column;gap:6px">'+['Nguyệt kỵ','Nguyệt tận','Tam nương','Dương Công kỵ nhật'].map(function(k){var h=n.ky.indexOf(k)>=0;return '<div class="ok'+(h?' no':'')+'">'+(h?svg('x',16,'var(--bfg)'):svg('ck',16,'var(--pri)'))+'<span>'+k+': '+(h?'phạm':'không phạm')+'</span></div>'}).join('')+'</div>',chip(ky?'Phạm '+ky+' kỵ':'Không phạm kỵ',ky?'b':'g'))+
card('Hướng xuất hành',kv([['Hỷ thần',n.hyThan+' (nên đi)'],['Tài thần',n.taiThan+' (nên đi)']]))+
card('Ngũ hành',kv([['Ngày','Ngày '+n.canChiNgay+', hành '+n.hanhNgay+': '+n.quanHe+', '+n.quanHeCat],['Nạp âm',n.napAm.charAt(0).toUpperCase()+n.napAm.slice(1)],['Lục hợp',n.lucHop],['Tam hợp',n.tamHop.join(', ')+' ('+n.tamHopCuc+' cục)'],['Xung',n.xung],['Hại / Phá',n.hai+' / '+n.pha]]))+
card('Bành Tổ bách kỵ',kv([['Can '+n.canChiNgay.split(' ')[0],n.bpCan],['Chi '+n.canChiNgay.split(' ')[1],n.bpChi]]))+
card('Nhị thập bát tú: sao '+n.sao,kv([['Hành',n.saoHanh],['Đánh giá',n.saoR>0?'Sao tốt: thuận lợi để khởi sự, cưới hỏi, xây cất, khai trương.':'Sao xấu: nên hạn chế việc lớn như cưới hỏi, xây cất, khai trương.']]),chip(n.saoR>0?'Sao tốt':'Sao xấu',n.saoR>0?'g':'b'))+
card('Kiến trừ: Trực '+n.truc,kv([['Nên làm',n.nen],['Kiêng kỵ',n.tranh]]),chip(n.trucR>0?'Trực tốt':n.trucR<0?'Trực xấu':'Trung bình',n.trucR>0?'g':n.trucR<0?'b':''))+
card('Đánh giá chung','<div class="txt">'+(n.hoangDao?'Ngày hoàng đạo':'Ngày hắc đạo')+', sao '+n.sao+(n.saoR>0?' (tốt)':' (xấu)')+', trực '+n.truc+'. '+(ky?'Phạm '+n.ky.join(', ')+'.':'Không phạm ngày kỵ.')+'</div>',chip(dg,dc))+
'<div class="note">Thông tin mang tính tham khảo theo lịch vạn niên truyền thống.</div></div>'}
function findV(){var y=S.fy,m=S.fm,dim=new Date(y,m,0).getDate(),l=[];
for(var d=1;d<=dim;d++){var n=info(y,m,d);if(n.hoangDao&&n.nen.indexOf(S.fk)>=0&&!n.ky.length)l.push({d:d,n:n})}
var h='<div class="top"><div><h1>Xem ngày</h1><div class="sub">Chọn việc cần làm để tìm ngày hợp trong tháng</div></div></div><div class="chips" style="padding:0 4px">'+VIEC.map(function(v){return '<button class="pill'+(S.fk===v[0]?' on':'')+'" data-a="fk" data-v="'+v[0]+'">'+v[1]+'</button>'}).join('')+'</div>'+
'<div class="bar"><b>Tháng '+m+', '+y+'</b><div class="arrows"><button class="ib" data-a="fp" aria-label="Tháng trước">'+svg('l',18)+'</button><button class="ib" data-a="fn" aria-label="Tháng sau">'+svg('r',18)+'</button></div></div>'+
'<div class="note" style="font-weight:700">'+l.length+' ngày phù hợp với việc '+S.fk+'</div>';
h+=l.length?l.map(function(x){var n=x.n,b=n.diem>=4?'Rất tốt':n.diem>=2?'Tốt':'Tạm được';return '<button class="it" data-a="open" data-y="'+y+'" data-m="'+m+'" data-d="'+x.d+'"><div class="d">'+x.d+'<span>'+WDL[dow(y,m,x.d)].replace('Thứ ','T').replace('Chủ Nhật','CN')+'</span></div><div class="x"><b>'+x.d+'/'+m+' · '+n.ld+'/'+n.lm+' âm</b><div>'+n.canChiNgay+' · '+n.than+' · Trực '+n.truc+' · Sao '+n.sao+'</div></div>'+chip(b,n.diem>=2?'g':'')+'</button>'}).join(''):'<div class="empty">Tháng này không có ngày hợp với việc đã chọn.</div>';
return '<div class="page"><div class="scroll">'+h+'<div class="note">Chỉ lấy ngày hoàng đạo, trực hợp với việc đã chọn và không phạm ngày kỵ. Kết quả mang tính tham khảo.</div></div></div>'}
function convV(){var tdv=T.y+'-'+p2(T.m)+'-'+p2(T.d),il=info(T.y,T.m,T.d);
var inp=S.cv==='s2l'?'<div><label for="sd">Chọn ngày dương lịch</label><input id="sd" type="date" value="'+tdv+'"></div>':'<div class="row3"><div><label for="ld">Ngày âm</label><input id="ld" type="number" inputmode="numeric" min="1" max="30" value="'+il.ld+'"></div><div><label for="lm">Tháng âm</label><input id="lm" type="number" inputmode="numeric" min="1" max="12" value="'+il.lm+'"></div><div><label for="ly">Năm âm</label><input id="ly" type="number" inputmode="numeric" value="'+il.ly+'"></div></div>';
return '<div class="page"><div class="scroll"><div class="top"><h1>Đổi ngày</h1></div><div class="chips" style="padding:0 4px"><button class="pill'+(S.cv==='s2l'?' on':'')+'" data-a="cv" data-v="s2l">Dương sang âm</button><button class="pill'+(S.cv==='l2s'?' on':'')+'" data-a="cv" data-v="l2s">Âm sang dương</button></div>'+inp+'<button class="btn" data-a="doconv">Chuyển đổi</button><div id="res">'+S.res+'</div></div></div>'}
function nav(){var t=[['cal','Lịch','cal'],['find','Xem ngày','s'],['conv','Đổi ngày','cv']];return '<div class="nav">'+t.map(function(x){return '<button class="'+(S.tab===x[0]?'on':'')+'" data-a="tab" data-v="'+x[0]+'">'+svg(x[2],22)+x[1]+'</button>'}).join('')+'</div>'}
function render(){var h;if(S.view==='day')h=dayV();else{h=(S.tab==='cal'?cal():S.tab==='find'?findV():convV())+nav()}$('#app').innerHTML=h}
function resHtml(y,m,d,ly){var n=info(y,m,d);return card('Kết quả',kv([['Dương lịch',lbl(y,m,d)],['Âm lịch',n.ld+' tháng '+n.lm+(n.leap?' nhuận':'')+' năm '+n.ly],['Can Chi','Ngày '+n.canChiNgay+', tháng '+n.canChiThang+', năm '+n.canChiNam]]))}
function shift(k){var d=new Date(S.sel.y,S.sel.m-1,S.sel.d+k);S.sel={y:d.getFullYear(),m:d.getMonth()+1,d:d.getDate()};render();var s=$('.scroll');if(s)s.scrollTop=0}
document.addEventListener('click',function(ev){var el=ev.target.closest('[data-a]');if(!el)return;var a=el.dataset.a,v=el.dataset.v;
if(a==='open'){S.sel={y:+el.dataset.y,m:+el.dataset.m,d:+el.dataset.d};S.view='day';render()}
else if(a==='back'){S.view='main';render()}else if(a==='pd')shift(-1);else if(a==='nd')shift(1);
else if(a==='prev'||a==='next'){S.m+=a==='next'?1:-1;if(S.m<1){S.m=12;S.y--}if(S.m>12){S.m=1;S.y++}render()}
else if(a==='tab'){if(v==='cal'&&S.tab==='cal'){S.y=T.y;S.m=T.m}S.tab=v;render()}
else if(a==='fk'){S.fk=v;render()}
else if(a==='fp'||a==='fn'){S.fm+=a==='fn'?1:-1;if(S.fm<1){S.fm=12;S.fy--}if(S.fm>12){S.fm=1;S.fy++}render()}
else if(a==='cv'){S.cv=v;S.res='';render()}
else if(a==='doconv'){var out='';
if(S.cv==='s2l'){var s=($('#sd').value||'').split('-').map(Number);if(s.length===3&&s[0]>1900&&s[0]<2100)out=resHtml(s[0],s[1],s[2]);else out='<div class="empty">Chọn ngày dương lịch từ năm 1901 đến 2099.</div>'}
else{var ld=+$('#ld').value,lm=+$('#lm').value,ly=+$('#ly').value;
if(!(ld>=1&&ld<=30&&lm>=1&&lm<=12&&ly>1900&&ly<2100))out='<div class="empty">Nhập ngày, tháng, năm âm lịch hợp lệ.</div>';
else{var r=Lunar.lunar2solar(ld,lm,ly),b=Lunar.solar2lunar(r[0],r[1],r[2]);out=(b.d===ld&&b.m===lm&&!b.leap)?resHtml(r[2],r[1],r[0]):'<div class="empty">Ngày âm lịch này không tồn tại (tháng chỉ có 29 ngày hoặc là tháng nhuận).</div>'}}
S.res=out;$('#res').innerHTML=out}});
render();
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
})();
</script>
</body>
</html>
